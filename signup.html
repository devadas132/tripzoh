<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#E8FBE6',
                            100: '#CFF7CC',
                            500: '#32C62A',
                            600: '#0EBB00',
                            700: '#0A9800'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-100 font-sans">

<div class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg border border-slate-200">

        <!-- Header -->
        <div class="px-6 py-5 text-center border-b border-slate-200">

            <h2 class="text-2xl font-bold text-slate-900">
                Registration Form
            </h2>

            <p class="text-sm text-slate-500 mt-1">
                Register your company to get started.
            </p>

        </div>

        <!-- Form -->
        <form class="p-6 space-y-4">

            <!-- Company -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">
                    Company Name
                </label>

                <input
                    type="text"
                    placeholder="Enter Company Name"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600">
            </div>

            <!-- Manager & Mobile -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        Manager Name
                    </label>

                    <input
                        type="text"
                        placeholder="Manager Name"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        placeholder="Mobile Number"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600">
                </div>

            </div>

            <!-- Currency & Email -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        Currency
                    </label>

                    <select
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600">

                        <option selected disabled>Select Currency</option>
                        <option>INR (₹)</option>
                        <option>USD ($)</option>
                        <option>EUR (€)</option>
                        <option>AED (د.إ)</option>
                        <option>SAR (﷼)</option>

                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="example@domain.com"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600">
                </div>

            </div>

            <!-- Address -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">
                    Company Details / Address
                </label>

                <textarea
                    rows="3"
                    placeholder="Enter company address and business details"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600"></textarea>
            </div>

            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">

                Register

            </button>

            <!-- Note -->
            <p class="text-xs text-center text-slate-500">
                * A verification link will be sent to your registered email address.
            </p>

        </form>

    </div>

</div>

</body>
</html>
