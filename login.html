<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripZoh | Sign In</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#E8FBE6',
                            100: '#CFF7CC',
                            500: '#32C62A',
                            600: '#0EBB00',
                            700: '#0A9800'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-100 font-sans">

<div class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200">

        <!-- Header -->
        <div class="px-6 py-6 text-center border-b border-slate-200">
            <h2 class="text-2xl font-bold text-slate-900">
                Welcome Back
            </h2>

            <p class="text-sm text-slate-500 mt-2">
                Sign in to your TripZoh account.
            </p>
        </div>

        <!-- Form -->
        <form class="p-6 space-y-5">

            <!-- Email -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600 transition">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600 transition">
            </div>

            <!-- Remember + Forgot -->
<div class="text-right">
    <a href="#" class="text-sm text-brand-600 hover:text-brand-700 font-medium">
        Forgot Password?
    </a>
</div>

            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200">

                Sign In

            </button>

            <!-- Divider -->
            <div class="flex items-center gap-4">
                <div class="flex-1 h-px bg-slate-200"></div>
                <span class="text-xs text-slate-400 uppercase">or</span>
                <div class="flex-1 h-px bg-slate-200"></div>
            </div>

            <!-- Register -->
            <p class="text-center text-sm text-slate-600">
                Don't have an account?

                <a href="signup.html" class="text-brand-600 font-semibold hover:text-brand-700">
                    Create Account
                </a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
